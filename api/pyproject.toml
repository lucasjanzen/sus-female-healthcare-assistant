[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check --fix ."
check = "ruff format --check . && ruff check ."
dev = "uvicorn app.main:app --reload --port 8000"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
