[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check --fix ."
check = "ruff format --check . && ruff check ."
dev = "uvicorn app.main:app --reload --port 8000"
migrate = "alembic upgrade head"
worker = "celery -A celery_app worker --loglevel=info --pool=solo"
install = "pip install -r requirements.txt"
seed = "python seed.py"
seed-history = "python seed-history.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
