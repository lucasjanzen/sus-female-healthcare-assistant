services:
  db:
    image: postgres:16
    container_name: sfha_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfha_db}
      POSTGRES_USER: ${POSTGRES_USER:-sfha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfha}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfha} -d ${POSTGRES_DB:-sfha_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sfha_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: sfha_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    restart: unless-stopped

  worker:
    build:
      context: ./api
    container_name: sfha_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sfha_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
