services:
  db:
    image: postgres:16
    container_name: sfha_db
    environment:
      POSTGRES_DB: sfha_db
      POSTGRES_USER: sfha
      POSTGRES_PASSWORD: sfha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfha -d sfha_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: sfha_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sfha_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
