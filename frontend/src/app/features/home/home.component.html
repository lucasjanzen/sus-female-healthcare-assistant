<div class="home-container">
  <div class="welcome-section">
    <h1 class="welcome-title">Bem-vindo(a), {{ roleLabel() }} {{ currentUser()?.nome }}!</h1>
    <p class="welcome-subtitle">Selecione uma opção abaixo para iniciar.</p>
  </div>

  <div class="features-grid">
    @for (card of featureCards(); track card.route) {
      <mat-card class="feature-card" (click)="navigateTo(card.route)">
        <mat-card-content>
          <div class="card-icon">
            <mat-icon>{{ card.icon }}</mat-icon>
          </div>
          <h2 class="card-title">{{ card.title }}</h2>
          <p class="card-description">{{ card.description }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
