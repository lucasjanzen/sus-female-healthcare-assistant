<div class="page">
  <div class="page-header">
    <h1 class="page-title">{{ titulo() }}</h1>
    @if (faseBadge(); as badge) {
      <span class="page-badge">{{ badge }}</span>
    }
  </div>

  @if (modo === 'nova') {
    <app-step-recepcao />
  } @else if (encerramentoPronto()) {
    <app-step-encerramento [pronto]="true" />
  } @else if (consultaAtiva()) {
    <app-step-consulta (confirmado)="irParaEncerramento()" />
  }
</div>
