<div class="consulta-container" style="padding: 24px; max-width: 1100px; margin: 0 auto;">
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
    <button mat-icon-button (click)="voltarHome()" title="Voltar ao início" aria-label="Voltar">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2 style="margin: 0; font-size: 1.25rem; font-weight: 500;">Nova Consulta</h2>
  </div>

  <mat-stepper #stepper linear orientation="horizontal">

    <!-- Step 1 — Recepção -->
    <mat-step [completed]="recepcaoConcluida()">
      <ng-template matStepLabel>Recepção</ng-template>
      <app-step-recepcao (recepcaoConcluida)="onRecepcaoConcluida($event)" />
    </mat-step>

    <!-- Step 2 — Consulta -->
    <mat-step [completed]="consultaConcluida()" [editable]="recepcaoConcluida()">
      <ng-template matStepLabel>
        Consulta
        @if (!recepcaoConcluida()) {
          <mat-icon style="font-size: 14px; height: 14px; width: 14px; vertical-align: middle;">lock</mat-icon>
        }
      </ng-template>

      @if (consultaAtiva() && etapa1()) {
        <app-step-consulta
          [consultaAtiva]="consultaAtiva()!"
          [etapa1]="etapa1()!"
          (consultaConcluida)="onConsultaConcluida()"
        />
      }
    </mat-step>

    <!-- Step 3 — Encerramento -->
    <mat-step [editable]="false" [completed]="false">
      <ng-template matStepLabel>
        Encerramento
        @if (!consultaConcluida()) {
          <mat-icon style="font-size: 14px; height: 14px; width: 14px; vertical-align: middle;">lock</mat-icon>
        }
      </ng-template>
      <p style="padding: 24px; color: #666;">Encerramento — disponível ao final da consulta.</p>
    </mat-step>

  </mat-stepper>
</div>
